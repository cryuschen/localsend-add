[package]
name = "localsend-picker"
version = "1.18.2"
edition = "2024"

[dependencies]
anyhow = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
dirs = "6.0"
futures-channel = "0.3"
futures-util = "0.3"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
